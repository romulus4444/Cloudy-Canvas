apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudy-canvas
  labels:
    app.kubernetes.io/name: cloudy-canvas
    app.kubernetes.io/instance: cloudy-canvas
spec:
  # Exactly one copy: two would answer every command twice and race on the settings files.
  # Recreate stops the old pod before the new one starts, which also frees the ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudy-canvas
      app.kubernetes.io/instance: cloudy-canvas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudy-canvas
        app.kubernetes.io/instance: cloudy-canvas
    spec:
      serviceAccountName: cloudy-canvas
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudy-canvas
          image: ghcr.io/romulus4444/cloudy-canvas
          imagePullPolicy: IfNotPresent
          envFrom:
            # Must hold DiscordSettings__token; may hold ManebooruSettings__token.
            - secretRef:
                name: cloudy-canvas-secrets
            # Optional non-secret settings, e.g. DiscordSettings__BroadcastUserIds__0 or LogRetention__RetentionDays.
            - configMapRef:
                name: cloudy-canvas-config
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # No probes on purpose: the bot has no port and the image has no shell to run a check with.
          # It exits with a non-zero code on fatal errors (bad token, crashed worker), so the kubelet restarts it.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # Created by whoever runs the bot, not by this kustomization, so removing or renaming these manifests can never delete the bot's data.
        - name: data
          persistentVolumeClaim:
            claimName: cloudy-canvas-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
