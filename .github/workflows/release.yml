name: Container Release

# Pushing a tag such as v1.2.3 builds the image, pushes it to ghcr.io/<owner>/cloudy-canvas, and then pushes the
# Kubernetes manifests in deploy/kubernetes (pinned to that image's digest) to ghcr.io/<owner>/cloudy-canvas-manifests.
# Clusters that follow the manifests artifact (for example with a Flux OCIRepository) pick up the new release on their own.
# Pull requests only build the image, to check that it still builds.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - mane

permissions:
  contents: read

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/cloudy-canvas" >> "$GITHUB_OUTPUT"
          echo "manifests=ghcr.io/${owner}/cloudy-canvas-manifests" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-pr.${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Flux CLI
        if: github.event_name == 'push'
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39  # v2.9.6

      - name: Push Kubernetes manifests
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MANIFESTS: ${{ steps.names.outputs.manifests }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          cd deploy/kubernetes
          kustomize edit set image "ghcr.io/romulus4444/cloudy-canvas=${IMAGE}@${DIGEST}"
          kustomize build . > /dev/null
          flux push artifact "oci://${MANIFESTS}:${VERSION}" \
            --path=. \
            --source="https://github.com/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
